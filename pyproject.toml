[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkatoms"
version = "0.3.0.dev0"
description = "Elegant vector drawings of atomic structures in matplotlib"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joel Crewe" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "matplotlib>=3.6", "scipy>=1.8"]
keywords = ["matplotlib", "crystal structure", "molecule", "visualisation", "materials"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/JoelCrewe/InkAtoms"
Documentation = "https://joelcrewe.github.io/InkAtoms"
Issues = "https://github.com/JoelCrewe/InkAtoms/issues"
Changelog = "https://github.com/JoelCrewe/InkAtoms/blob/main/CHANGELOG.md"

[project.scripts]
inkatoms = "inkatoms.cli:main"

[project.optional-dependencies]
ase = ["ase>=3.22"]
pymatgen = ["pymatgen"]
rdkit = ["rdkit"]
mdanalysis = ["MDAnalysis"]
ml = ["dscribe", "ase>=3.22"]
all = ["ase>=3.22", "pymatgen", "rdkit", "MDAnalysis", "pillow", "dscribe"]
dev = ["pytest", "pytest-mpl", "ase>=3.22", "rdkit", "MDAnalysis", "pillow"]
docs = ["sphinx", "sphinx-gallery", "furo", "ase>=3.22", "rdkit", "pillow"]
tutorial = ["ase>=3.22", "rdkit", "ipywidgets", "jupyterlab"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/_build", "docs/auto_examples", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["src/inkatoms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
