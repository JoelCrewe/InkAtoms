name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The image baselines were rendered on macOS; Linux font and anti-aliasing
      # differences would fail them, so only the macOS jobs compare images.
      - name: Tests (with image comparison)
        if: runner.os == 'macOS'
        run: python -m pytest --mpl -q
      - name: Tests
        if: runner.os != 'macOS'
        run: python -m pytest -q
      - name: Command-line smoke test
        run: |
          python -c "from ase.build import molecule; from ase.io import write; write('m.xyz', molecule('CH3COOH'))"
          inkatoms m.xyz -o m.pdf --bond-orders
